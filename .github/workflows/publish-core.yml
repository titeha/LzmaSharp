name: Publish Core (NuGet)

# Публикация пакета Ti-Soft.LzmaSharp по тегу core/X.Y.Z (напр. core/0.1.0).
# MinVer берёт версию из тега. Публикация — через NuGet TRUSTED PUBLISHING (OIDC): долгоживущий
# API-ключ НЕ нужен; nuget.org выдаёт временный ключ по OIDC-токену воркфлоу.
#
# Настройка на стороне nuget.org (один раз): создать trusted-publishing ПОЛИТИКУ для пакета
# Ti-Soft.LzmaSharp (или glob Ti-Soft.*), привязанную к репозиторию titeha/LzmaSharp и этому
# workflow-файлу (publish-core.yml). Плюс задать repo-переменную NUGET_USER = имя аккаунта nuget.org
# (Settings → Secrets and variables → Actions → Variables). GitFlic — зеркало; РФ-раннер — отдельный шаг.
on:
  push:
    tags: ['core/*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC для trusted publishing
      contents: write # для создания GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer: версия из тега

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Публикуем ТОЛЬКО ядро — независимо от UI (core отдельный трек).
      - name: Test core
        run: dotnet test tests/Lzma.Core.Tests/Lzma.Core.Tests.csproj -c Release --verbosity quiet

      - name: Pack
        run: dotnet pack src/Lzma.Core/Lzma.Core.csproj -c Release -o out

      # SBOM (CycloneDX) — приложение к релизу (задел под провенанс/госсектор).
      # Шаг БЛОКИРУЮЩИЙ (остаток G8): релиз без SBOM не публикуется. Версия тулзы закреплена —
      # 6.3.1 (опубликована 2026-10-12; именно она сформировала bom.json релиза core/1.2.0),
      # поэтому флаги CLI детерминированы и прежний повод «не блокировать публикацию» устранён.
      # test -s не даёт попасть в активы релиза пустому или отсутствующему bom.json.
      - name: SBOM
        run: |
          set -euo pipefail
          dotnet tool install --global CycloneDX --version 6.3.1
          dotnet CycloneDX src/Lzma.Core/Lzma.Core.csproj --output out --json
          test -s out/bom.json

      # Trusted publishing: обмен OIDC-токена на временный ключ nuget.org.
      - name: NuGet login (trusted publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # NUGET_USER = имя аккаунта nuget.org. Берём из repo-Variable, а если пусто — из Secret
          # (устойчиво к тому, куда именно положено значение — vars ИЛИ secrets; конец пинг-понга).
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Тело релиза берём из аннотации тега: softprops/action-gh-release сам её не подставляет.
      # ВАЖНО: actions/checkout оставляет ссылку на тег «лёгкой» (lightweight), поэтому
      # git tag -l --format=%(contents) возвращает СООБЩЕНИЕ КОММИТА, а не аннотацию — именно так
      # релиз core/1.3.0 получил тело из merge-коммита вместо релизных нот. Объект тега догружаем
      # явным fetch и читаем его через git cat-file tag (тело — всё после первой пустой строки).
      - name: Release notes (из аннотации тега)
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" || true
          : > release-notes.md
          if [ "$(git cat-file -t "refs/tags/$tag" 2>/dev/null || echo missing)" = "tag" ]; then
            git cat-file tag "refs/tags/$tag" | awk 'f { print } /^$/ && !f { f = 1 }' > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            {
              echo "Релиз $tag (коммит $GITHUB_SHA)."
              echo "Аннотация тега пуста или тег не аннотированный — подробности в журнале репозитория."
            } > release-notes.md
          fi
          wc -c release-notes.md
          head -3 release-notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            out/*.nupkg
            out/*.snupkg
            out/*.json
